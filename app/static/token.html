<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My token</title>
<style>
  :root { --blue: #2457d6; --blue-soft: #eaf0fe; --ink: #172036; --muted: #5c6880; --ok: #1d8556; --ok-soft: #e4f4eb; --amber: #8a5a00; --amber-soft: #fbf1d9; --line: #dde4ee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f7fb; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Nirmala UI", "Noto Sans Telugu", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  .wrap { max-width: 440px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; }
  header strong { font-size: 1.1rem; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 10px 30px rgba(23, 32, 54, .07); text-align: center; animation: pop .35s ease-out both; }
  .lbl { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .tok { font-size: 4.2rem; font-weight: 800; color: var(--blue); line-height: 1.05; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .dept { font-weight: 600; }
  .te { color: var(--muted); font-size: .95rem; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 6px; }
  .big div { background: var(--blue-soft); border-radius: 14px; padding: 12px 8px; }
  .big strong { display: block; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .big span { font-size: .82rem; color: var(--muted); }
  .now { margin-top: 10px; font-size: 1rem; }
  .now b { color: var(--blue); }
  .state { margin-top: 14px; padding: 12px; border-radius: 12px; font-weight: 700; }
  .state.turn { background: var(--ok-soft); color: var(--ok); font-size: 1.25rem; animation: pulse 1.4s ease-in-out infinite; }
  .state.done { background: var(--blue-soft); color: var(--blue); }
  .state.away { background: var(--amber-soft); color: var(--amber); }
  .doc { margin-top: 12px; color: var(--muted); font-size: .92rem; }
  .foot { margin-top: 16px; font-size: .85rem; color: var(--muted); text-align: center; line-height: 1.45; }
  .err { text-align: center; color: var(--muted); padding: 40px 10px; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M7 2h6v5h5v6h-5v5H7v-5H2V7h5z" fill="#fff"/></svg></span><strong id="hosp">Hospital</strong></header>
  <div id="box" class="card"><div class="err">Loading your token…</div></div>
  <p class="foot">Keep this page open. It updates by itself.<br>ఈ పేజీని తెరిచి ఉంచండి. ఇది తనంతట తానే మారుతుంది.</p>
</div>
<script>
'use strict';
const code = new URLSearchParams(location.search).get('c') || '';
const box = document.getElementById('box');
let lastStatus = null;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
async function load() {
  let d;
  try {
    const r = await fetch('/api/token?c=' + encodeURIComponent(code));
    d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Not found');
  } catch (e) {
    box.replaceChildren(el('div', 'err', e.message === 'Failed to fetch' ? 'Cannot reach the hospital right now. Please check you are on the hospital Wi-Fi.' : e.message));
    return;
  }
  document.getElementById('hosp').textContent = d.hospital || 'Hospital';
  document.title = 'Token ' + d.token;
  if (d.expired) { box.replaceChildren(el('div', 'lbl', 'Token'), el('div', 'tok', d.token), el('div', 'err', 'This token was for an earlier day.')); return; }
  const kids = [el('div', 'lbl', 'Your token · మీ టోకెన్'), el('div', 'tok', d.token), el('div', 'dept', d.dept), d.dept_te ? el('div', 'te', d.dept_te) : null];
  if (d.status === 'waiting') {
    const g = el('div', 'big');
    const a = el('div'); a.append(el('strong', null, d.ahead), el('span', null, d.ahead === 1 ? 'patient ahead of you · ముందు ఉన్నవారు' : 'patients ahead of you · ముందు ఉన్నవారు'));
    const m = el('div'); m.append(el('strong', null, d.minutes ? '~' + d.minutes : '0'), el('span', null, 'minutes (about) · నిమిషాలు'));
    g.append(a, m);
    kids.push(g);
    const now = el('div', 'now'); now.append('Now with the doctor: ', el('b', null, d.now || '—'));
    kids.push(now);
    if (d.ahead <= 1) kids.push(el('div', 'state away', 'Please come close to the doctor\'s room now. · దయచేసి డాక్టర్ గది దగ్గరికి రండి.'));
  } else if (d.status === 'called') {
    kids.push(el('div', 'state turn', 'It is your turn. Please go in. · మీ వంతు వచ్చింది. దయచేసి లోపలికి వెళ్ళండి.'));
  } else if (d.status === 'done') {
    kids.push(el('div', 'state done', 'Seen by the doctor. Thank you. · డాక్టర్ చూశారు. ధన్యవాదాలు.'));
  } else if (d.status === 'skipped') {
    kids.push(el('div', 'state away', 'You were called but not here. Please tell reception. · పిలిచినప్పుడు లేరు. రిసెప్షన్‌లో చెప్పండి.'));
  }
  if (d.doctor) {
    const words = { in: 'In', delayed: 'Delayed', surgery: 'In surgery', out: 'Not in yet' };
    kids.push(el('div', 'doc', d.doctor + ' · ' + (words[d.doctor_status] || '') + (d.doctor_note ? ' (' + d.doctor_note + ')' : '')));
  }
  box.replaceChildren(...kids.filter(Boolean));
  if (d.status === 'called' && lastStatus && lastStatus !== 'called' && navigator.vibrate) navigator.vibrate([300, 150, 300]);
  lastStatus = d.status;
}
load();
setInterval(() => { if (!document.hidden) load(); }, 12000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
